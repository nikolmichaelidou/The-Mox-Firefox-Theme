<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="3000" height="200" viewBox="0 0 3000 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0D0E15"/>
      <stop offset="0.55" stop-color="#110618"/>
      <stop offset="1" stop-color="#1A0827"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14091F" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#14091F" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#14091F" stop-opacity="1"/>
      <stop offset="1" stop-color="#14091F" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7000FF" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#7000FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FF007F" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF007F" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#FF007F" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00F0FF" stop-opacity="0.7"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7000FF" stroke-width="1" opacity="0.1"/>
    </pattern>
    <g id="log" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="11">
      <text x="0" y="16" fill="#55EAD4" textLength="1500" lengthAdjust="spacing">[ OK ] mox.sys boot 0x7F3A :: NET//LINK ESTABLISHED :: ICE BREACH 0xC0FFEE :: packet 4F 2A 9B 11 :: uplink 99.8% :: [ OK ]</text>
      <text x="0" y="34" fill="#9B6BFF" textLength="1500" lengthAdjust="spacing">01001101 01001111 01011000 :: ctrl.flow 0xFF00 :: handshake sync :: cipher AES-256 :: trace 0.00ms :: sector 07 scan</text>
    </g>
  </defs>

  <rect width="3000" height="200" fill="url(#bg)"/>
  <rect width="3000" height="110" fill="url(#grid)"/>
  <rect x="1800" width="1200" height="110" fill="url(#glow)"/>

  <g opacity="0.3">
    <use xlink:href="#log" x="0">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1500 0" dur="120s" repeatCount="indefinite"/>
    </use>
    <use xlink:href="#log" x="1500">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1500 0" dur="120s" repeatCount="indefinite"/>
    </use>
    <use xlink:href="#log" x="3000">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1500 0" dur="120s" repeatCount="indefinite"/>
    </use>
  </g>

  <rect width="3000" height="200" fill="url(#fade)"/>

  <g transform="translate(2490 7)" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace">
    <path d="M0 0H272L284 12V30H12L0 18Z" fill="#0D0E15" fill-opacity="0.9" stroke="#FF007F" stroke-opacity="0.8" stroke-width="1.5"/>
    <circle cx="20" cy="15" r="3.5" fill="#00F0FF">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text x="34" y="19" font-size="12" font-weight="bold" fill="#00F0FF" textLength="102" lengthAdjust="spacing">MOX://TERMINAL</text>
    <rect x="148" y="7" width="1" height="16" fill="#7000FF"/>
    <text x="160" y="19" font-size="12" fill="#FF4DA6" textLength="106" lengthAdjust="spacing">netrunner@mox:~$</text>
    <rect x="270" y="9" width="7" height="12" fill="#00F0FF">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="0" y="0" width="3000" height="2" fill="url(#edge)"/>
</svg>
