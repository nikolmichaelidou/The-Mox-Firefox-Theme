<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="3000" height="200" viewBox="0 0 3000 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0D0E15"/>
      <stop offset="0.6" stop-color="#110618"/>
      <stop offset="1" stop-color="#1A0827"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14091F" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#14091F" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#14091F" stop-opacity="1"/>
      <stop offset="1" stop-color="#14091F" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7000FF" stop-opacity="0"/>
      <stop offset="0.75" stop-color="#7000FF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FF007F" stop-opacity="0.26"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF007F" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#FF007F" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00F0FF" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00F0FF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#00F0FF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#000000" opacity="0.28"/>
    </pattern>
    <g id="log" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="11">
      <text x="0" y="16" fill="#55EAD4" textLength="1500" lengthAdjust="spacing">[ OK ] mox.sys boot 0x7F3A :: NET//LINK ESTABLISHED :: ICE BREACH 0xC0FFEE :: packet 4F 2A 9B 11 :: uplink 99.8% :: [ OK ]</text>
      <text x="0" y="34" fill="#9B6BFF" textLength="1500" lengthAdjust="spacing">&gt; ssh netrunner@mox.local -p 2077 :: auth ok :: daemon quickhack.exe :: <tspan fill="#FF4DA6">loc: Lizzie's Bar, Kabuki</tspan> :: 01001101 01001111 01011000</text>
    </g>
  </defs>

  <rect width="3000" height="200" fill="url(#bg)"/>
  <rect x="1800" width="1200" height="110" fill="url(#glow)"/>

  <g opacity="0.32">
    <g>
      <use xlink:href="#log" x="0"/>
      <use xlink:href="#log" x="1500"/>
      <use xlink:href="#log" x="3000"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1500 0" dur="90s" repeatCount="indefinite"/>
    </g>
  </g>

  <rect x="0" y="0" width="260" height="100" fill="url(#beam)">
    <animate attributeName="x" from="-260" to="3000" dur="12s" repeatCount="indefinite"/>
  </rect>

  <rect width="3000" height="100" fill="url(#scan)"/>

  <rect x="2000" y="22" width="420" height="2" fill="#FF007F" opacity="0">
    <animate attributeName="opacity" values="0;0;0;0;0.7;0;0;0.4;0;0" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="y" values="22;22;22;22;14;22;22;30;22;22" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
  </rect>

  <rect width="3000" height="200" fill="url(#fade)"/>
  <rect width="3000" height="2" fill="url(#edge)"/>

  <g transform="translate(2400 8)" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="12">
    <path d="M0 0H250L260 10V28H10L0 18Z" fill="#0D0E15" fill-opacity="0.9" stroke="#7000FF" stroke-width="1.5"/>
    <text x="14" y="19" font-weight="bold" fill="#FF007F" textLength="56" lengthAdjust="spacing">BREACH</text>
    <g fill="#00F0FF" fill-opacity="0.75">
      <text x="84" y="19">1C</text>
      <text x="120" y="19">BD</text>
      <text x="156" y="19">55</text>
      <text x="192" y="19">E9</text>
      <text x="228" y="19">7A</text>
    </g>
    <rect x="80" y="6" width="24" height="17" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0">
      <animate attributeName="opacity" values="1;0;0;0;0;0" calcMode="discrete" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect x="116" y="6" width="24" height="17" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0">
      <animate attributeName="opacity" values="0;1;0;0;0;0" calcMode="discrete" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect x="152" y="6" width="24" height="17" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0;0;0" calcMode="discrete" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect x="188" y="6" width="24" height="17" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0">
      <animate attributeName="opacity" values="0;0;0;1;0;0" calcMode="discrete" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect x="224" y="6" width="24" height="17" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0">
      <animate attributeName="opacity" values="0;0;0;0;1;0" calcMode="discrete" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g transform="translate(2672 8)" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="12">
    <path d="M0 0H178L190 12V28H12L0 16Z" fill="#0D0E15" fill-opacity="0.9" stroke="#FF007F" stroke-opacity="0.85" stroke-width="1.5"/>
    <circle cx="16" cy="14" r="3" fill="#00F0FF">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="19" fill="#FF4DA6" textLength="128" lengthAdjust="spacing">netrunner@mox:~$</text>
    <rect x="162" y="8" width="7" height="13" fill="#00F0FF">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
